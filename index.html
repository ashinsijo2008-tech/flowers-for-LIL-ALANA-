<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Alana ❤️</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:linear-gradient(135deg,#ffd6e7,#fff3f8);
overflow:hidden;
text-align:center;
}

.container{
margin-top:200px;
}

h1{
color:#ff4d8d;
font-size:40px;
}

button{
padding:15px 40px;
font-size:18px;
border:none;
border-radius:25px;
background:#ff4d8d;
color:white;
cursor:pointer;
}

.love{
opacity:0;
transition:2s;
font-size:26px;
color:#ff2a73;
margin-top:40px;
}

.tulip{
position:fixed;
top:-50px;
font-size:30px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh);
}
}
</style>

</head>
<body>

<div class="container">
<h1>Alana, here are your flowers 🌷</h1>

<button onclick="start()">Open</button>

<div id="message" class="love">
Alana ❤️<br><br>
These flowers are for you.<br>
Every tulip falling reminds me how lucky I am to have you.<br><br>
I love you 🌷
</div>
</div>

<script>

function start(){

document.getElementById("message").style.opacity = 1

setInterval(function(){

let tulip = document.createElement("div")

tulip.className="tulip"

tulip.innerHTML="🌷"

tulip.style.left=Math.random()*100+"vw"

tulip.style.animationDuration=(Math.random()*3+3)+"s"

document.body.appendChild(tulip)

setTimeout(()=>{tulip.remove()},6000)

},80)

}

</script>

</body>
</html>
